# Format, licence notices, the build and the container image on every push and pull request.
# Touches no cloud account: the image is built and tried here, never pushed.

name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Format, licence notices and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # the container image's Node
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json

      # No install script runs, as in the image and the deploy pipeline.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Format
        run: npm run format:check

      - name: Licence notices
        run: npm run check:license

      - name: Build
        run: npx ng build

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: >-
          docker build
          --build-arg VERSION="$(node -p 'require("./package.json").version')"
          --build-arg REVISION="${GITHUB_SHA}"
          -t assay-fe:ci .

      # It serves /healthz and the app's routes; no API is needed for either.
      - name: Try it
        run: |
          docker run -d --name fe -p 8080:8080 -e ASSAY_API_URL=http://127.0.0.1:9 assay-fe:ci
          curl -fsS --retry 10 --retry-delay 1 --retry-connrefused --retry-all-errors http://localhost:8080/healthz
          curl -fsS http://localhost:8080/settings | grep -q '<app-root>'

      # Without the API's address it stops at once, with exit code 1 (the step fails if it runs on).
      - name: It refuses to start without ASSAY_API_URL
        run: |
          docker run -d --name no-api assay-fe:ci
          test "$(timeout 30 docker wait no-api)" = 1

  release:
    name: Release tag matches the version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag is "v" and package.json's version
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "The tag ${GITHUB_REF_NAME} isn't v${version}, package.json's version" >&2
            exit 1
          }
