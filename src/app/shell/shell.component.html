<div class="page">
  <header class="nav">
    <a routerLink="/" class="brand"><span class="brand-mark"></span>Assay</a>
    <nav class="links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        >Overview</a
      >
      <a routerLink="/datasets" routerLinkActive="active">Datasets</a>
      <a routerLink="/tests" routerLinkActive="active">Tests</a>
      <a routerLink="/test-sets" routerLinkActive="active">Test sets</a>
      <a routerLink="/test-plans" routerLinkActive="active">Test plans</a>
      <a routerLink="/test-types" routerLinkActive="active">Test types</a>
      <a routerLink="/guide" routerLinkActive="active">Guide</a>
    </nav>
    <div class="conn">
      <button class="btn btn-ghost btn-sm" (click)="theme.toggle()">
        {{ theme.isDark() ? 'Light' : 'Dark' }}
      </button>
    </div>
  </header>
  <router-outlet />
  <footer class="foot text-muted">
    <span><a [href]="apiBase + '/docs'" target="_blank" rel="noopener">API documentation</a></span
    ><span>Assay 0.9.3</span>
  </footer>
</div>
