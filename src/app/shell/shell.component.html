<div class="page">
  <header class="bar">
    <a routerLink="/" class="brand"><span class="brand-mark"></span>Assay</a>
    <nav class="links" aria-label="Main">
      @for (l of work; track l.path) {
        <a
          class="bar-link"
          [routerLink]="l.path"
          routerLinkActive="on"
          [routerLinkActiveOptions]="{ exact: !!l.exact }"
          ariaCurrentWhenActive="page"
          >{{ l.label }}</a
        >
      }
      <assay-reference-menu />
    </nav>
    <div class="util">
      <a
        class="bar-link small-caps"
        routerLink="/settings"
        routerLinkActive="on"
        ariaCurrentWhenActive="page"
        >Settings</a
      >
      <assay-theme-switch />
    </div>
    <assay-app-menu />
  </header>
  <router-outlet />
  <footer class="foot text-muted">
    <span><a [href]="apiBase + '/docs'" target="_blank" rel="noopener">API documentation</a></span
    ><span>Assay 1.0.0</span>
  </footer>
</div>
