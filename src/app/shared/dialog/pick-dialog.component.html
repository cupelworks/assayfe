<assay-dialog
  [kicker]="kicker()"
  [title]="title()"
  [primaryLabel]="busy() ? 'Saving…' : submitLabel()(picked().length)"
  [primaryDisabled]="!picked().length || busy()"
  [error]="error()"
  (primary)="confirm.emit(picked())"
  (close)="closed.emit()"
>
  <assay-smart-filter
    [compact]="true"
    [facets]="facets()"
    [placeholder]="placeholder()"
    [label]="'Filter the ' + (noun() || 'list')"
    [(query)]="query"
    [(words)]="words"
    [(chosen)]="chosen"
  />
  <div class="meta">
    <span
      >{{ filtered() ? shown().length + ' of ' + rows().length : rows().length }} {{ noun() }} ·
      {{ picked().length }} ticked</span
    >
    @if (open().length) {
      <button type="button" class="all" (click)="all()">
        {{ allPicked() ? 'Untick all' : 'Tick all ' + open().length }}
      </button>
    }
  </div>
  <div class="list" role="group" [attr.aria-label]="noun() || title()">
    @for (r of shown(); track r.id) {
      <label class="row" [class.off]="r.disabled" [class.on]="picked().includes(r.id)">
        <input
          type="checkbox"
          class="chk"
          [checked]="picked().includes(r.id)"
          [disabled]="r.disabled"
          (change)="toggle(r.id)"
        />
        <span class="txt"
          ><b class="nm" [class.dim]="r.dim">{{ r.name }}</b>
          @if (r.sub) {
            <span class="sub">{{ r.sub }}</span>
          }
        </span>
        @if (r.meta) {
          <span class="m" [title]="r.meta">{{ r.meta }}</span>
        }
      </label>
    } @empty {
      <div class="empty">{{ rows().length ? 'Nothing matches the filter.' : emptyText() }}</div>
    }
  </div>
</assay-dialog>
