<div
  class="dialog-backdrop wrap"
  (click)="dismiss()"
  (keydown.escape)="dismiss()"
  (wheel)="stopOutside($event)"
  (touchmove)="stopOutside($event)"
>
  <div
    class="dialog box"
    [class.wide]="wide()"
    [class.danger]="danger()"
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
  >
    <div class="head">
      @if (kicker()) {
        <div class="kicker">{{ kicker() }}</div>
      }
      <h2>{{ title() }}</h2>
    </div>
    <div class="body"><ng-content /></div>
    @if (error(); as e) {
      <div class="err">
        <span>{{ e }}</span>
        <ng-content select="[errDetail]" />
      </div>
    }
    <div class="dialog-actions foot">
      <button
        class="btn btn-primary btn-tall"
        (click)="primary.emit()"
        [disabled]="primaryDisabled()"
      >
        {{ primaryLabel() }}
      </button>
      <button type="button" class="cancel" [disabled]="busy()" (click)="dismiss()">Cancel</button>
      @if (blockers().length; as n) {
        <div class="blockers" role="status">
          <span class="strong">{{ n }} {{ n === 1 ? 'thing' : 'things' }} to fix:</span>
          {{ blockersText() }}
        </div>
      }
    </div>
  </div>
</div>
