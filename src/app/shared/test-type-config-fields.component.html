@if (sections().length) {
  <div class="ttc">
    @for (s of sections(); track s.name) {
      <div class="ttc-section">
        <div class="ttc-head">{{ s.name }}</div>
        @for (f of s.fields; track f.key) {
          <div class="field">
            <label>
              {{ f.label }}
              @if (!f.required) {
                <span class="hint">- optional</span>
              }
              @if (numericFieldHint(f, s.comparison); as hint) {
                <span class="hint">- {{ hint }}</span>
              }
            </label>
            @switch (f.kind) {
              @case ('numeric') {
                <input
                  class="input num"
                  assayNumber
                  [placeholder]="f.placeholder ?? ''"
                  [ngModel]="fieldValue(s.name, f.key)"
                  (ngModelChange)="setFieldValue(s.name, f.key, $event)"
                />
              }
              @case ('jsonpath') {
                <input
                  class="input mono"
                  spellcheck="false"
                  [placeholder]="f.placeholder ?? ''"
                  [ngModel]="fieldValue(s.name, f.key)"
                  (ngModelChange)="setFieldValue(s.name, f.key, $event)"
                />
              }
              @default {
                <textarea
                  class="input ta"
                  [class.mono]="f.kind === 'json'"
                  rows="3"
                  [attr.spellcheck]="f.kind === 'json' ? 'false' : null"
                  [placeholder]="f.placeholder ?? ''"
                  [ngModel]="fieldValue(s.name, f.key)"
                  (ngModelChange)="setFieldValue(s.name, f.key, $event)"
                ></textarea>
              }
            }
            @if (f.hint) {
              <div class="field-hint">{{ f.hint }}</div>
            }
          </div>
        }
      </div>
    }
  </div>
}
