<div class="g-wrap">
  <assay-guide-head
    kicker="Results"
    title="Runs"
    lede="Every run started one at a time: a test on its own, or a set or a plan, a test at a time. A statistics batch's runs are on the batch's page."
  >
    <assay-catalog-index
      label="Show only one status"
      [items]="tiles()"
      [groups]="tileGroups"
      [across]="6"
      [selected]="oneStatus()"
      (selectedChange)="pickTile($event)"
    />
  </assay-guide-head>

  <assay-smart-filter
    label="Filter the runs"
    placeholder="Tests, sets, plans - or type status, from, check…"
    wordsIn="the names of the tests, sets and plans"
    [facets]="facets()"
    [shown]="list.shownText()"
    [sortOptions]="sortOptions"
    [(query)]="list.words.query"
    [(words)]="list.words.kept"
    [chosen]="list.choice()"
    (chosenChange)="choose($event)"
    [(sort)]="list.sort"
  />

  <assay-catalog-table class="list" label="Runs" [columns]="columns" [empty]="emptyText()">
    @for (v of view(); track v.r.id) {
      <assay-catalog-row
        [name]="statusLabel(v.r.status)"
        [mark]="v.r.status"
        [link]="v.link"
        [linkLabel]="v.label"
        [expandable]="false"
      >
        <assay-catalog-cell caption="Test">
          @if (v.testId) {
            <a class="cell-nm" [routerLink]="['/tests', v.testId]">{{ v.name }}</a>
          } @else {
            <span class="cell-nm">{{ v.name }}</span>
          }
        </assay-catalog-cell>
        <assay-catalog-cell caption="From">
          @if (v.scope; as s) {
            <assay-kind-name [kind]="s.kind" [name]="s.name" [link]="s.link" />
          } @else {
            <span class="muted">On its own</span>
          }
        </assay-catalog-cell>
        <assay-catalog-cell caption="Its checks">
          <assay-checks-met [checks]="v.checks" />
        </assay-catalog-cell>
        <assay-catalog-cell caption="When"
          ><span class="when"><assay-rel-time [iso]="v.r.created_at" /></span
        ></assay-catalog-cell>
        <assay-catalog-cell caption="ID" [copyId]="v.r.id" />
      </assay-catalog-row>
    }
  </assay-catalog-table>
  <assay-pager
    [total]="list.page.total()"
    [offset]="list.page.offset()"
    [limit]="list.page.limit()"
    (offsetChange)="list.page.go($event)"
    (limitChange)="list.page.size($event)"
  />
</div>
