<div class="g-wrap">
  <assay-guide-head
    size="one"
    kicker="Run"
    [crumbs]="crumbs()"
    [copyId]="execId()"
    [title]="title()"
    [lede]="lede()"
  >
    <div class="page-aside" guideHeadAside>
      <button type="button" class="btn btn-primary" (click)="replay()" [disabled]="act.busy()">
        {{ act.busy() ? 'Starting…' : 'Replay' }}
      </button>
      <span class="why">Runs the same copies again</span>
    </div>
    <div class="now">
      <div class="went">
        <assay-status-tally
          caption="How it went"
          [detail]="'its ' + counted(tests(), 'test')"
          noun="tests"
          [parts]="testParts()"
          [still]="true"
        />
        @if (facts(); as f) {
          <p class="facts">{{ f }}</p>
        }
        @if (replayedLink(); as l) {
          <a class="go" [routerLink]="l">The run it replayed →</a>
        }
      </div>
      <assay-status-tally
        caption="Its checks"
        [detail]="'in the ' + counted(tests(), 'test')"
        noun="checks"
        [parts]="checkParts()"
        [still]="true"
      />
    </div>
  </assay-guide-head>

  <assay-banner [msg]="act.msg() ?? loadMsg()" />

  <assay-guide-section
    [section]="sections[0]"
    [sub]="
      kind() === 'test-sets'
        ? 'Each test of the set, run once - the set\'s copy, as it was'
        : 'Each test of the plan\'s sets, run once - their copies, as they were'
    "
  >
    <div class="listbar">
      <span
        ><b>{{ tests() }}</b> {{ tests() === 1 ? 'test' : 'tests' }}</span
      >
      <assay-sort [options]="sortOptions" [(value)]="sort" />
    </div>
    <assay-catalog-table label="Its tests" [columns]="columns" [empty]="emptyText()">
      @for (v of rows(); track v.r.id) {
        <assay-catalog-row
          [name]="statusLabel(v.r.status)"
          [mark]="v.r.status"
          [expandable]="false"
        >
          <assay-catalog-cell caption="Test">
            <a class="cell-nm" [routerLink]="v.link">{{ v.name }}</a>
            @if (v.source) {
              <span class="under"><assay-catalog-tag [tag]="{ text: v.source }" /></span>
            }
          </assay-catalog-cell>
          <assay-catalog-cell caption="Its checks">
            <assay-checks-met [checks]="v.checks" />
          </assay-catalog-cell>
          <assay-catalog-cell caption="Run ID" [copyId]="v.r.id" />
        </assay-catalog-row>
      }
    </assay-catalog-table>
    <assay-pager
      [total]="page.total()"
      [offset]="page.offset()"
      [limit]="page.limit()"
      (offsetChange)="page.go($event)"
      (limitChange)="page.size($event)"
    />
  </assay-guide-section>
</div>
