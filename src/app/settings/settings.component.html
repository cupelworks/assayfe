<div class="g-wrap">
  <assay-guide-head
    kicker="Settings"
    title="What Assay tests, and who judges it"
    lede="The application Assay asks for answers, the model that grades them, and what runs it all. A change applies from the next run; past runs keep what they scored."
    navLabel="The settings"
    [sections]="sections()"
    [across]="4"
  />

  <assay-settings-group
    [section]="sections()[0]"
    [config]="target"
    (loaded)="saved.target.set($event)"
  />
  <assay-settings-group
    [section]="sections()[1]"
    [config]="judge"
    [context]="{ targetUrl: targetUrl() }"
    (loaded)="saved.judge.set($event)"
  />
  <assay-worker-status [section]="sections()[2]" (loaded)="workers.set($event)" />

  <assay-guide-section [section]="sections()[3]" sub="Read-only · read once when a process starts">
    <p class="intro">
      Changing one means restarting the API and/or the worker. Connection strings are never shown -
      they can embed credentials.
    </p>
    <assay-catalog-table class="wide" label="Operations" [columns]="opColumns">
      @for (o of operations; track o.label) {
        <assay-catalog-row [name]="o.label" [expandable]="false">
          <assay-catalog-cell caption="Value"
            ><span [class.mono]="o.mono">{{ o.value }}</span></assay-catalog-cell
          >
          <assay-catalog-cell caption="What it is"
            ><span class="muted">{{ o.hint }}</span></assay-catalog-cell
          >
        </assay-catalog-row>
      }
    </assay-catalog-table>
  </assay-guide-section>
</div>
