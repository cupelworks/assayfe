# The app's security headers, included in each location that serves it: a location with its own
# add_header drops the ones above it.
#
# The policy: everything from the app's own origin. Styles may also be inline, for the <style>
# elements Angular adds at runtime; the build puts no inline script in index.html
# (angular.json: inlineCritical off).
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
